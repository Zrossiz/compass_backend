name: compass

services:
  backend:
    build:
      context: ..
      dockerfile: build/Dockerfile
    env_file:
      - ../.env
    ports:
      - '9000:9000'
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  migrator:
    build:
      context: ..
      dockerfile: build/Dockerfile
    profiles: ['tools']
    entrypoint: ['node', 'dist/migrator.js']
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: compass
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: compass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
